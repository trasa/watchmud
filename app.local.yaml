# An example Configuration file for starting the WatchMUD server locally
---

# where the log is written to
log:
  file: ./bin/watchmud-server.log
  level: debug

# Content Configuration
contentPath: ./content

# GRPC listener
serverPort: 10000
# HTTP listener
webPort: 8888

# Database Configuration
db:
  useSSH: false
  ssh:
    user: ssh-user
    host: bastion.example.com
    port: 22
    keyfile: /Users/watchmud/.ssh/veryverysekrit.pem
  user: watchmud
  password: password1  # please don't
  host: localhost
  port: 5432
  name: watchmud
