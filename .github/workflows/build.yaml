# Test everything, and build the image for every branch that matters.
#
#   master, release/*, hotfix/*   test, then push ghcr.io/watchmud/watchmud:<branch>
#                                 and :sha-<commit> -- development images
#   a tag vX.Y.Z                  test, then push :vX.Y.Z -- the only kind of image
#                                 production runs; the tag must be on a release/
#                                 or hotfix/ branch
#   a pull request                test, and build the image without pushing it
#
# Nothing here deploys. Production moves when someone runs deploy/deploy.sh on it
# with a version tag. The image holds content/ too, so a version pins the code
# and the rules and zones together.

name: build

on:
  push:
    branches: [master, "release/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  # a newer push to the same branch makes an older run pointless; tags always finish
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # for the mongostore tests that need a real one (make test-db)
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: make check (gofmt, vet, tests)
        run: make check
      - name: mongo tests against a real mongo
        run: make test-db TEST_MONGO_URI=mongodb://localhost:27017
      - name: deploy/compose.yaml is valid
        # dummy values: this checks the file, not the secrets
        run: |
          printf '%s\n' MONGO_ROOT_PASSWORD=x WATCHMUD_DB_PASSWORD=x WATCHMUD_VERSION=v0.0.0 \
            SPACES_REGION=nyc3 SPACES_BUCKET=x SPACES_KEY=x SPACES_SECRET=x > /tmp/ci.env
          docker compose --env-file /tmp/ci.env -f deploy/compose.yaml config --quiet

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tag check below needs the branches

      - name: a version tag must be on a release/ or hotfix/ branch
        if: github.ref_type == 'tag'
        run: |
          if ! git branch -r --contains "$GITHUB_SHA" | grep -qE '^\s*origin/(release|hotfix)/'; then
            echo "::error::$GITHUB_REF_NAME is not on a release/ or hotfix/ branch; production images come from those"
            exit 1
          fi

      - name: what the binary will call itself
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(echo "$GITHUB_REF_NAME" | tr '/' '-')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false # nothing should ever run "latest"
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64 # the droplet
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
